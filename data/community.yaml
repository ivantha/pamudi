# Speaking, mentoring, event work, judging and competitions — the page 2
# Community section. Grouped into a mapping because each list is a distinct
# subsection with its own heading.
#
# `text` carries Typst markup (*strong*, _emphasis_), same as experience bullets.

speaking:
  - year: "2025"
    text: UX session and workshop for undergraduates, *NSBM Green University*
  - year: "2022"
    text: Speaker, *RevolUX 2.0*
  - year: "2020"
    text: Talk on UI/UX foundations plus an Adobe XD workshop, *Creative Eye*

mentoring:
  - year: "2026"
    text: >-
      Mentor, *IEEE Young Protégé 2026*: twelve weeks from June, guiding two
      mentees on industry practice and on improving user experience
  # The three designers who reported to her across the senior role, not a
  # standing team of three: she carried one at a time. The 2025 appraisal names
  # only the then-current report, so this row spans the role rather than that
  # cycle. Experience states the line-management fact and stops there; the
  # mentoring itself is detailed here, which is the section that is about it.
  - year: "2022–26"
    text: >-
      Internal mentoring at Zone24x7: three direct reports over the period, one
      at a time, each taken through design reviews, skill-gap assessment and a
      curated learning path
  - year: "2025"
    text: >-
      Knowledge Partner, *Young Protégé 2025*: guided a young professional
      through a full UI/UX project lifecycle
  - year: "2023"
    text: Knowledge-transfer sessions for two client project teams

events:
  - year: "2021–22"
    text: Designer and Treasurer, *ClubZone* at Zone24x7
  - year: "2021"
    text: Designer, *IWM South Asia* and *Women Techmakers*
  - year: "2019"
    text: Designer, *DevFest Sri Lanka*
  # Student-era office-holding, eight years back and three lines long. Off the
  # PDF, kept on the site. Rows here honour include_in, same as everywhere else.
  - year: "2017–18"
    include_in: [web]
    # The trailing "design lead across twelve student conferences including IEEE
    # SLSYW Congress" was removed on 2026-09-03: `student_events` below is the
    # section dedicated to them and names all twelve, and the summary also
    # overstated the role, since she was Design Lead on SLSYW alone and
    # Designer on the rest.
    text: >-
      Head of Designing, *IEEE Student Branch, UCSC*; Head of Marketing,
      *Pahasara*

judging: >-
  *Codescape* 2022 · *ReidCon* Ideathon and How Series 2021 · *Creative Eye* web
  design contest 2020 · *Designathon* 2018

# Trimmed to the current entry. The undergraduate placings — She Coderess, UVA
# Hackathon 2017 and IEEE Xtreme 10.0, 2016 — are on the record here but off the
# page: nine years on, they dilute rather than support the senior claim.
competitions: Zone AI Hackathon 2025

# ── Website only ─────────────────────────────────────────────────────────
# Three sections the two-page CV has no room for. cv/cv.typ reads `speaking`,
# `mentoring`, `events`, `judging` and `competitions` by name and ignores every
# other key, so anything added below reaches the website alone.
#
# They stay separate keys rather than `include_in: [web]` rows in the lists
# above because they are distinct subsections on the About page, not filtered-out
# members of an existing one. (The lists above *are* filtered on `include_in`
# now, on both sides — see `keep()` in cv/common/loaders.typ.)

# Beyond the Zone24x7 UX blog post, which lives in personal.yaml under `blog`
# because the CV masthead cites it. The site renders that one first.
writing:
  - text: Technology articles for *Windows Geek*
  - text: Articles for *Pahasara*, the UCSC students’ blog

