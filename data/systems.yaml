# Design systems inventory — the page 2 table on the CV.
#
# `lead: true` marks a system she built from scratch and owned end to end; the
# table renders those differently. `include_in` picks consumers ([cv, web]).
#
# Product names are anonymised with domain descriptors. `client` describes the
# industry context; `description` carries the full project description for the
# website. The mapping from these descriptors to the original product names is
# maintained offline.
#
# `detail` is an inline annotation after the product name in the CV's grouped
# table (e.g. "4 modules"). `stack_cv` overrides `stack` for the CV when the
# grouped table merges scope into the display (the "Further engagements" group).
#
# Ordering: entries are grouped for the CV table (Owned, Extended, Contributed,
# Further engagements). Within each group the order matches the design.

